<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Steve's Workout Tracker</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--mut:#94a3b8;--fg:#f1f5f9;--ac:#22c55e;--ac2:#38bdf8;--bd:#334155}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:80px}
header{padding:16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}h1{font-size:18px;margin:0}small,.mut{color:var(--mut)}
main{padding:12px;max-width:640px;margin:auto}.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;border:1px solid var(--bd)}
.card.next{border-color:var(--ac2);box-shadow:0 0 0 2px #38bdf855}.card.done{opacity:.75;border-color:var(--ac)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--bd);color:var(--fg)}button.pri{background:var(--ac);color:#052e16;font-weight:700}button.sm{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;background:#0b1220;color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
.row{display:flex;gap:8px;align-items:center}.set{display:grid;grid-template-columns:30px 1fr 1fr 40px;gap:6px;align-items:center;margin:6px 0}
.set input[type=checkbox]{width:26px;height:26px;accent-color:var(--ac)}.tag{display:inline-block;background:#0b1220;border-radius:6px;padding:2px 7px;font-size:12px;margin:2px 4px 2px 0;color:var(--ac2)}
.bar{height:8px;background:#0b1220;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;border-radius:0;background:none;padding:14px 4px}nav button.on{color:var(--ac)}
.days{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{color:#fbbf24;font-size:13px}.note{font-style:italic;color:#cbd5e1;font-size:13px}
#timer{position:fixed;bottom:64px;right:12px;background:var(--ac2);color:#082f49;padding:10px 16px;border-radius:30px;font-weight:700;display:none;z-index:9}
h2{font-size:16px;margin:4px 0}h3{font-size:15px;margin:0}
</style></head><body>
<header><h1>Push · Pull · Legs</h1><small>Steve Erickson · 8-day cycle: 3 on, 1 off</small></header>
<main id="app"></main><div id="timer"></div>
<nav><button data-v="home" class="on">Today</button><button data-v="session">Session</button><button data-v="schedule">Schedule</button><button data-v="history">History</button><button data-v="plan">Routines</button></nav>
<script>
"use strict";
const LOC={SM:"Smith Machine",CT:"Cable Tower",M:"Machine",DB:"Dumbbell",KB:"Kettlebell",BB:"Barbell",PF:"PF 360 Room",Y:"Yellow Room","A&S":"Stretching Room","":"—"};
const E=(loc,name,w,sets,reps,rest,notes)=>({loc,name,w,sets,reps,rest,notes:notes||""});
const C=(...a)=>Object.assign(E(...a),{core:true});
// Legacy 4-day plan (kept so old logged sessions still display)
const OLD=[
{t:"Day 1 · Upper Body",ex:[E("DB","Standing Barbell Curl","40+",3,"10-12","1","Bump up to 50 3/3"),E("DB","Hammer Curls","15-20",3,"12","1","1 arm at a time"),E("DB","Lawn Mowers","25",3,"12","1"),E("CT","Seated Row","70",3,"12","1"),E("CT","Lat Pull Down","70",3,"12","1","outside, mid, inside"),E("CT","Tricep Pull Down","35-40",3,"12","1","Black rope"),E("M","Tricep Press Down","90",3,"12","1"),E("M","Bicep Curl","35-40",3,"12","1")]},
{t:"Day 2 · Core",ex:[E("PF","Battle Ropes","",3,"1 min","2"),E("PF","Rope Pull Down","",3,"1 min","2"),E("PF","Tire Ball Slams","",3,"12","2"),E("CT","Abs Side Pull","20-30",3,"12","2","Both sides"),E("M","Abdominal","90",3,"12","2"),E("","Dead Bugs","",3,"10","2"),E("","Transfers","",3,"10","2"),E("","Plank","",2,"1 min","2")]},
{t:"Day 3 · Chest & Shoulders",ex:[E("DB","Seated DB Chest Press","35+",3,"10-12","1","elbows together"),E("M","Rec Fly","70",3,"12","1"),E("M","Hammer St Shoulder Press","40",3,"12","1-2"),E("M","Hammer St Chest Press","30",3,"12","1-2"),E("M","Hammer St Incline Chest Press","25",3,"12","1-2"),E("M","Hammer St Front Pull Down","50",3,"12","1-2","down inside, hug tree, sky"),E("CT","Chest Fly Cables","15-20",3,"12","1-2")]},
{t:"Day 4 · Lower Body",ex:[E("M","Big Leg Press","300",3,"12","1-2","Slow"),E("M","Leg Extension","55",3,"12","1-2","Hold for 3 sec"),E("M","Seated Leg Curl","50",3,"12","1"),E("M","Calves (manual)","50",3,"12","1"),E("M","Hip Adductor","55",3,"12","1","lean back, lean forward"),E("M","Hip Abductor","60",3,"12","1-2"),E("KB","Goblet or KB Squats","30",3,"12","")]}];
const R={
pull:{t:"Pull · Back, Biceps, Shoulders",ex:[E("CT","Lat Pull Down","70",3,"10-12","1-2","outside, mid, inside"),E("CT","Seated Row","70",3,"12","1-2"),E("DB","Lawn Mowers","25",3,"12","1","1-arm DB row"),E("CT","Face Pulls","20-30",3,"15","1","rope, rear delts"),E("DB","DB Lateral Raise","10-15",3,"12-15","1"),E("BB","Standing Barbell Curl","40+",3,"10-12","1"),E("DB","Hammer Curls","15-20",3,"12","1"),C("","Elevated Leg Lifts","",3,"12","1"),C("","Plank","",2,"1 min","1")]},
push:{t:"Push · Chest, Triceps, Shoulders",ex:[E("DB","Seated DB Chest Press","35+",3,"10-12","1-2","elbows together"),E("M","Hammer St Incline Chest Press","25",3,"12","1-2"),E("CT","Chest Fly Cables","15-20",3,"12","1"),E("M","Hammer St Shoulder Press","40",3,"12","1-2"),E("CT","Tricep Pull Down","35-40",3,"12","1","Black rope"),E("M","Tricep Press Down","90",3,"12","1"),C("CT","Abs Side Pull","20-30",3,"12","1","Both sides"),C("","Dead Bugs","",3,"10","1")]},
legs:{t:"Legs · Quads, Hamstrings, Glutes, Calves",ex:[E("M","Big Leg Press","300",3,"12","1-2","Slow"),E("KB","Goblet or KB Squats","30",3,"12","1-2"),E("DB","DB Romanian Deadlift","25-30",3,"10-12","1-2","hips back, flat back"),E("M","Leg Extension","55",3,"12","1","Hold for 3 sec"),E("M","Seated Leg Curl","50",3,"12","1"),E("M","Calves (manual)","50",3,"12","1"),C("M","Abdominal","90",3,"12","1"),C("","Decline Sit-ups","",3,"12","1")]}};
const RK=["pull","push","legs"];
const CYC=["pull","push","legs","rest","pull","push","legs","rest"];
const CARDIO=["Treadmill (8–12.5% incline)","StairMaster","Elliptical","Rower","Bike"];
const K="steveWT_v1";let S=JSON.parse(localStorage.getItem(K)||"null")||{hist:[],tw:{},cur:null};
// migrate v1 -> v2: old sessions keep numeric .day (legacy plan); targets re-keyed by exercise name
if(!S.v){const tw={};for(const k in S.tw){const[d,i]=k.split(":");const e=OLD[d]&&OLD[d].ex[i];if(e)tw[e.name]=S.tw[k]}S.tw=tw;if(S.cur){S.cur.end=new Date().toISOString();S.cur.notes=(S.cur.notes?S.cur.notes+" ":"")+"(unfinished, saved during upgrade)";S.hist.push(S.cur);S.cur=null}S.v=2}
const ymd=d=>{d=new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
if(!S.anchor)S.anchor=ymd(new Date());
const save=()=>localStorage.setItem(K,JSON.stringify(S));save();
const pl=s=>s.r?R[s.r]:OLD[s.day]||{t:"?",ex:[]};
const tw=e=>S.tw[e.name]??e.w;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);let view="home",sel=null;
const DAY=864e5,dnum=s=>{const[a,b,c]=s.split("-");return Date.UTC(a,b-1,c)/DAY};
function cyc(date){return((dnum(ymd(date))-dnum(S.anchor))%8+8)%8}
function lastFor(name){for(let j=S.hist.length-1;j>=0;j--){const h=S.hist[j],P=pl(h);const i=P.ex.findIndex(e=>e.name===name);const e=i<0?null:h.ex[i];if(!e)continue;const ws=e.sets.filter(s=>s.done&&s.w).map(s=>s.w);if(ws.length)return{w:ws[ws.length-1],r:e.sets.filter(s=>s.done).map(s=>s.r).join("/"),date:h.date}}return null}
const exDone=e=>e.sets.length&&e.sets.every(s=>s.done);
function newSession(r){if(S.cur&&!confirm("Discard the session in progress?"))return;S.cur={r,cday:cyc(new Date())+1,date:new Date().toISOString(),ex:R[r].ex.map(e=>({sets:Array.from({length:e.sets},()=>({w:"",r:"",done:false}))})),cardio:{type:CARDIO[0],min:"",done:false},warm:false,cool:false,notes:""};save();go("session")}
function prog(s){const n=s.ex.filter(exDone).length+(s.r?(s.cardio.done?1:0):0);return[n,s.ex.length+(s.r?1:0)]}
function bar(a,b){return `<div class="bar"><i style="width:${b?Math.round(a/b*100):0}%"></i></div>`}
const loggedOn=(r,d)=>S.hist.some(h=>h.r===r&&ymd(h.date)===ymd(d));
const nm=r=>r==="rest"?"Rest":R[r].t.split(" ·")[0];
function home(){const c=cyc(new Date()),r=CYC[c];let h=`<div class="card next"><small>TODAY · CYCLE DAY ${c+1} OF 8</small><h2>${r==="rest"?"Rest day 😴":esc(R[r].t)}</h2>`;
 if(r==="rest")h+=`<p class="mut">Recover: stretch, walk, water, protein, sleep. Next up: ${nm(CYC[(c+1)%8])} tomorrow.</p>`;else h+=`<p class="mut">${R[r].ex.length} exercises incl. core · then 30 min cardio</p>`;
 if(S.cur){const[a,b]=prog(S.cur);h+=`<p>In progress: ${esc(nm(S.cur.r))} ${a}/${b}</p>${bar(a,b)}<p><button class="pri" onclick="go('session')">Resume session</button></p>`}else if(r!=="rest")h+=loggedOn(r,new Date())?`<p>✓ Logged today</p>`:`<button class="pri" onclick="newSession('${r}')">Start ${nm(r)}</button>`;
 h+=`</div><div class="card"><h3>Pick a routine</h3><div class="days" style="grid-template-columns:1fr 1fr 1fr;margin-top:8px">${RK.map(k=>`<button onclick="location.hash='${k}'">${nm(k)}</button>`).join("")}</div><small>Total sessions logged: ${S.hist.length}</small></div>
 <div class="card"><h3>Every workout</h3><p class="mut">6 min warm-up · lifts · core · 30 min cardio · cool-down & stretch. Slow movements. Drink water, eat protein & sleep.</p></div>`;return h}
function routine(r){const P=R[r];return `<div class="card next"><h2>${esc(P.t)}</h2><button class="pri" onclick="newSession('${r}')">Start ${nm(r)} session</button></div><div class="card">${P.ex.map(e=>{const L=lastFor(e.name);return `<div class="row" style="margin:8px 0;border-top:1px solid var(--bd);padding-top:8px"><div style="flex:1"><b>${e.core?'<span class="tag">CORE</span>':""}${esc(e.name)}</b><br><small>${esc(e.loc||"—")} · ${e.sets}×${esc(e.reps)} · rest ${esc(e.rest||"-")}${e.notes?" · "+esc(e.notes):""}</small>${L?`<div class="hint">Last used: ${esc(L.w)} lb</div>`:""}</div><button class="sm" onclick="editW('${esc(e.name)}','${esc(e.w)}')">${esc(tw(e)||"BW")}${tw(e)?" lb":""} ✎</button></div>`}).join("")}<div style="border-top:1px solid var(--bd);padding-top:8px"><b>Cardio · 30 min</b><br><small>${CARDIO.join(" / ")}</small></div></div>`}
function plan(){return `<div class="card"><div class="days" style="grid-template-columns:1fr 1fr 1fr">${RK.map(k=>`<button ${sel===k?'class="pri"':""} onclick="location.hash='${k}'">${nm(k)}</button>`).join("")}</div></div>`+(sel?routine(sel):RK.map(routine).join(""))+`<div class="card"><h3>Location key</h3><small>${Object.entries(LOC).filter(x=>x[0]).map(x=>x[0]+" = "+x[1]).join(" · ")}</small></div>`}
function schedule(){const c=cyc(new Date()),t=new Date();let h=`<div class="card"><h2>8-day cycle</h2><p class="mut">3 on, 1 off, repeating. Not tied to the weekday.</p>`;
 for(let k=0;k<8;k++){const d=new Date(t.getTime()+(k-c)*DAY),r=CYC[k];h+=`<div class="row" style="padding:8px;margin:4px 0;border-radius:8px;${k===c?"border:1px solid var(--ac2)":""}"><b style="width:56px">Day ${k+1}</b><span style="flex:1">${r==="rest"?'<span class="mut">Rest</span>':`<a href="#${r}" style="color:var(--fg)">${esc(R[r].t)}</a>`}</span><small class="mut">${d.toLocaleDateString(undefined,{weekday:"short",month:"numeric",day:"numeric"})}</small><span style="width:20px">${r!=="rest"&&loggedOn(r,d)?"✓":k===c?"◀":""}</span></div>`}
 h+=`</div><div class="card"><h3>Off schedule?</h3><small class="mut">Set which cycle day today is:</small><div class="row" style="margin-top:6px"><select id="cd">${CYC.map((r,k)=>`<option value="${k}" ${k===c?"selected":""}>Day ${k+1} · ${nm(r)}</option>`).join("")}</select><button class="sm" onclick="setDay(+$('#cd').value)">Set</button></div></div>`;return h}
function setDay(k){S.anchor=ymd(new Date(Date.now()-k*DAY));save();render()}
function session(){const s=S.cur;if(!s)return `<div class="card"><p>No active session. Pick a routine:</p><div class="days" style="grid-template-columns:1fr 1fr 1fr">${RK.map(k=>`<button class="pri" onclick="newSession('${k}')">${nm(k)}</button>`).join("")}</div></div>`;
 const P=R[s.r],[a,b]=prog(s);const ni=s.ex.findIndex(e=>!exDone(e));
 let h=`<div class="card"><small>Cycle day ${s.cday} · ${new Date(s.date).toLocaleDateString()}</small><h2>${esc(P.t)}</h2><div class="row"><span>${a}/${b} done</span><span class="mut" style="margin-left:auto">${ni<0?(s.cardio.done?"All done!":"Next: Cardio"):"Next: "+esc(P.ex[ni].name)}</span></div>${bar(a,b)}
 <label class="row" style="margin-top:8px"><input type="checkbox" style="width:22px" ${s.warm?"checked":""} onchange="S.cur.warm=this.checked;save()"> 6-min warm-up</label></div>`;
 P.ex.forEach((e,i)=>{const L=lastFor(e.name),x=s.ex[i],dn=exDone(x);const sd=x.sets.filter(z=>z.done).length,T=tw(e);
  h+=`${e.core&&!(P.ex[i-1]||{}).core?'<h3 style="margin:16px 4px 0">Core</h3>':""}<div class="card ${i===ni?"next":""} ${dn?"done":""}" id="ex${i}"><div class="row"><h3>${i===ni?"▶ ":dn?"✓ ":""}${esc(e.name)}</h3><small style="margin-left:auto">${sd}/${x.sets.length}</small></div>
  <div><span class="tag">${esc(e.loc||"—")} · ${esc(LOC[e.loc])}</span><span class="tag">Target ${esc(T||"BW")}${T?" lb":""}</span><span class="tag">${e.sets}×${esc(e.reps)}</span>${e.rest?`<span class="tag">Rest ${esc(e.rest)} min</span>`:""}</div>
  ${e.notes?`<div class="note">“${esc(e.notes)}”</div>`:""}${L?`<div class="hint">Last: ${esc(L.w)} lb × ${esc(L.r)} (${new Date(L.date).toLocaleDateString()})</div>`:""}
  <div class="set mut" style="font-size:12px"><span>Set</span><span>Weight</span><span>Reps</span><span>✓</span></div>
  ${x.sets.map((z,k)=>`<div class="set"><b>${k+1}</b><input inputmode="decimal" placeholder="${esc(L?L.w:T)}" value="${esc(z.w)}" onchange="upd(${i},${k},'w',this.value)"><input inputmode="numeric" placeholder="${esc(e.reps)}" value="${esc(z.r)}" onchange="upd(${i},${k},'r',this.value)"><input type="checkbox" ${z.done?"checked":""} onchange="chk(${i},${k},this.checked)"></div>`).join("")}
  <div class="row"><button class="sm" onclick="timer(${parseFloat(e.rest)||1})">⏱ Rest ${parseFloat(e.rest)||1}m</button><button class="sm" onclick="editW('${esc(e.name)}','${esc(e.w)}')">Edit target</button></div></div>`});
 h+=`<div class="card ${s.cardio.done?"done":ni<0?"next":""}"><h3>${s.cardio.done?"✓ ":""}Cardio · 30 min</h3><div class="row" style="margin-top:8px"><select onchange="S.cur.cardio.type=this.value;save()">${CARDIO.map(c=>`<option ${c===s.cardio.type?"selected":""}>${c}</option>`).join("")}</select><input style="width:80px" inputmode="numeric" placeholder="30" value="${esc(s.cardio.min)}" onchange="S.cur.cardio.min=this.value;save()"><input type="checkbox" style="width:26px;height:26px;accent-color:var(--ac)" ${s.cardio.done?"checked":""} onchange="S.cur.cardio.done=this.checked;if(this.checked&&!S.cur.cardio.min)S.cur.cardio.min='30';save();render()"></div>
 <label class="row" style="margin-top:8px"><input type="checkbox" style="width:22px" ${s.cool?"checked":""} onchange="S.cur.cool=this.checked;save()"> 6-min cool-down & stretch</label>
 <textarea placeholder="Session notes" style="margin-top:8px" onchange="S.cur.notes=this.value;save()">${esc(s.notes)}</textarea>
 <div class="row" style="margin-top:10px"><button class="pri" style="flex:1" onclick="finish()">Finish & save</button><button onclick="if(confirm('Discard this session?')){S.cur=null;save();go('home')}">Discard</button></div></div>`;return h}
function upd(i,k,f,v){S.cur.ex[i].sets[k][f]=v;save()}
function chk(i,k,v){const z=S.cur.ex[i].sets[k],e=R[S.cur.r].ex[i];z.done=v;if(v&&!z.w){const L=lastFor(e.name);z.w=L?L.w:String(tw(e)).replace(/[^\d.\-]/g,"").split("-")[0]}if(v&&!z.r)z.r=String(e.reps).split("-").pop();save();const y=scrollY;render();scrollTo(0,y)}
function editW(name,w){const cur=S.tw[name]??w;const v=prompt("New target weight for "+name+" (lb). Blank = reset to plan ("+w+")",cur);if(v===null)return;if(v.trim()==="")delete S.tw[name];else S.tw[name]=v.trim();save();const y=scrollY;render();scrollTo(0,y)}
function finish(){const[a,b]=prog(S.cur);if(a<b&&!confirm(`Only ${a}/${b} done. Save anyway?`))return;S.cur.end=new Date().toISOString();S.hist.push(S.cur);S.cur=null;save();go("history")}
function history(){if(!S.hist.length)return `<div class="card mut">No sessions yet.</div>`;let h="";const ord=S.hist.map((s,j)=>j).sort((x,y)=>new Date(S.hist[y].date)-new Date(S.hist[x].date));let last="";
 for(const j of ord){const s=S.hist[j],P=pl(s),[a,b]=prog(s),dd=new Date(s.date).toLocaleDateString(undefined,{weekday:"short",year:"numeric",month:"short",day:"numeric"});if(dd!==last){h+=`<h3 style="margin:16px 4px 0">${dd}</h3>`;last=dd}
 h+=`<div class="card"><div class="row"><h3>${esc(P.t)}</h3><small style="margin-left:auto">${s.r?"Cycle day "+s.cday:"Old plan"}</small></div><small>${a}/${b} done · Cardio: ${esc(s.cardio.min||0)} min ${esc(s.cardio.type)}${s.legLifts?" · Leg lifts "+esc(s.legLifts):""}${s.situps?" · Sit-ups "+esc(s.situps):""}</small>${bar(a,b)}
 <details><summary class="mut">Details</summary>${P.ex.map((e,i)=>{const x=s.ex[i];if(!x)return"";const t=x.sets.filter(z=>z.done).map(z=>`${z.w||"-"}×${z.r||"-"}`).join(", ");return `<div><small>${exDone(x)?"✓":"○"} ${esc(e.name)}: ${esc(t||"—")}</small></div>`}).join("")}${s.notes?`<p class="note">${esc(s.notes)}</p>`:""}<button class="sm" onclick="if(confirm('Delete session?')){S.hist.splice(${j},1);save();render()}">Delete</button></details></div>`}
 return h+`<div class="card"><button class="sm" onclick="exp()">Export JSON backup</button></div>`}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="workouts.json";a.click()}
let tH;function timer(m){clearInterval(tH);let t=Math.round(m*60);const el=$("#timer");el.style.display="block";const tick=()=>{el.textContent="Rest "+Math.floor(t/60)+":"+String(t%60).padStart(2,"0")+"  ✕";if(t--<=0){clearInterval(tH);el.textContent="Go! ✕";navigator.vibrate&&navigator.vibrate([300,100,300])}};tick();tH=setInterval(tick,1000);el.onclick=()=>{clearInterval(tH);el.style.display="none"}}
const V={home,session,schedule,history,plan};
function render(){$("#app").innerHTML=V[view]();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view))}
function go(v){if(location.hash.slice(1)!==v){location.hash=v;return}route()}
function route(){let h=location.hash.slice(1)||"home";sel=null;if(R[h]){sel=h;h="plan"}if(!V[h])h="home";view=h;render();scrollTo(0,0);if(view==="session"&&S.cur){const n=S.cur.ex.findIndex(e=>!exDone(e));const el=n>0&&$("#ex"+n);el&&el.scrollIntoView({block:"center"})}}
addEventListener("hashchange",route);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));route();
</script></body></html>
